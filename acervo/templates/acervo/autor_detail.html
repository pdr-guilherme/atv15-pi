{% extends "base.html" %}

{% block title %}
{{ autor.nome }}
{% endblock title %}

{% block content %}

  <ul>
    <li><strong>Nome:</strong> {{ autor.nome }}</li>

  </ul>
  <a href="{% url 'autor_list' %}">Voltar para lista de autores</a>
{% endblock %}
